apiVersion: v1
kind: Namespace
metadata:
  name: public-cloud
  labels:
    cloud-tier: public
    environment: simulated-cloud
---
# Redis Deployment in Public Cloud
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: public-cloud
  labels:
    app: redis
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: database
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
# Redis Service in Public Cloud
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: public-cloud
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
# Flask Web Deployment in Public Cloud
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
  namespace: public-cloud
  labels:
    app: flask-web
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-web
  template:
    metadata:
      labels:
        app: flask-web
        tier: frontend
    spec:
      containers:
        - name: flask-web
          image: visitor-counter:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
            - name: ENVIRONMENT_NAME
              value: "Public Cloud (AWS/GCP Simulated)"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
# Flask Service in Public Cloud (Port 31002)
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: public-cloud
spec:
  type: NodePort
  selector:
    app: flask-web
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 31002
