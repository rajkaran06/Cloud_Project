# ==============================================================================
# Docker Compose: Multi-Container Orchestration (Flask Web + Redis Cache)
# ==============================================================================

services:
  # Python Flask Application Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visitor-counter-web
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - PORT=5000
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Redis In-Memory Key-Value Store Service
  redis:
    image: redis:7.2-alpine
    container_name: visitor-counter-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped
    networks:
      - app-network

# Persistent storage for Redis state across container restarts
volumes:
  redis_data:
    name: visitor-counter-redis-data

# Isolated bridge network allowing DNS name resolution (web -> redis)
networks:
  app-network:
    name: visitor-counter-network
    driver: bridge
